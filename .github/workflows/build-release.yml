name: Build & Release (Windows exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set build paths
        shell: pwsh
        run: |
          # 单版本（2026-10-28 用户拍板：lite 退役，永远只做开发端）
          "SPEC=webai2api.spec" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DIST=dist"          | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORK=build"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPNAME=webai2api"  | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "picked ref=$env:GITHUB_REF"

      - name: Build exe
        shell: pwsh
        run: pyinstaller $env:SPEC --noconfirm --distpath $env:DIST --workpath $env:WORK

      - name: Copy usage note
        shell: pwsh
        run: |
          $app = "$env:DIST/$env:APPNAME"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "scripts/usage-pro.txt" "$app/使用说明.txt" -Force
          Get-Content "$app/使用说明.txt" -TotalCount 3

      - name: Package zip
        shell: pwsh
        run: |
          $app = "$env:DIST/$env:APPNAME"
          Remove-Item -Recurse -Force "$app/data" -ErrorAction SilentlyContinue
          Remove-Item -Force "$app/webai2api.log" -ErrorAction SilentlyContinue
          Remove-Item -Force "$app/current_port.txt" -ErrorAction SilentlyContinue
          Compress-Archive -Path $app -DestinationPath "$env:DIST/webai2api-win64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webai2api
          path: ${{ env.DIST }}/*-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST }}/*-win64.zip
          generate_release_notes: true
