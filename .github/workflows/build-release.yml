name: Build & Release (Windows exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller webai2api.spec --noconfirm --distpath dist --workpath build

      - name: Write usage note
        shell: pwsh
        run: |
          @"
          webai2api 使用说明

          1. 双击 webai2api.exe，会自动启动服务并打开管理面板
             （若没自动打开，浏览器访问 http://127.0.0.1:8800/admin，默认密码 admin）
          2. 面板「账号管理」点「浏览器登录」，登录你自己的 DeepSeek 账号
          3. 面板「API Key」生成一个 Key
          4. 在 opencode 里接入，Base URL 填 http://127.0.0.1:8800/v1
          5. 重启 opencode 即可使用

          数据（账号/Key/用量）保存在同目录 data 文件夹，删除即重置。
          端口默认 8800，被占用会自动更换（见 current_port.txt）。
          "@ | Out-File -Encoding utf8 dist/webai2api/使用说明.txt

      - name: Package zip
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/webai2api/data -ErrorAction SilentlyContinue
          Remove-Item -Force dist/webai2api/webai2api.log -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/webai2api -DestinationPath dist/webai2api-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webai2api-win64
          path: dist/webai2api-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/webai2api-win64.zip
          generate_release_notes: true
