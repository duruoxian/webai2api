name: Build & Release (Windows exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

# SignPath 代码签名（可选启用）：仓库 Settings → Secrets and variables 配置
#   Secrets：SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID
#   Variables：SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
# 未配置时签名步骤自动跳过，Release 照常发布未签名包。
# 申请 SignPath 开源签名：https://signpath.org （人工申请与审核，签名政策见仓库 CODE_SIGNING.md）
env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
  SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
  SIGNPATH_ARTIFACT_CFG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set build paths
        shell: pwsh
        run: |
          # 单版本（2026-10-28 用户拍板：lite 退役，永远只做开发端）
          "SPEC=webai2api.spec" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DIST=dist"          | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORK=build"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPNAME=webai2api"  | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "picked ref=$env:GITHUB_REF"

      - name: Build exe
        shell: pwsh
        run: pyinstaller $env:SPEC --noconfirm --distpath $env:DIST --workpath $env:WORK

      - name: Copy usage note
        shell: pwsh
        run: |
          $app = "$env:DIST/$env:APPNAME"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "scripts/usage.txt" "$app/使用说明.txt" -Force
          Get-Content "$app/使用说明.txt" -TotalCount 3

      - name: Package zip
        shell: pwsh
        run: |
          $app = "$env:DIST/$env:APPNAME"
          Remove-Item -Recurse -Force "$app/data" -ErrorAction SilentlyContinue
          Remove-Item -Force "$app/webai2api.log" -ErrorAction SilentlyContinue
          Remove-Item -Force "$app/current_port.txt" -ErrorAction SilentlyContinue
          Compress-Archive -Path $app -DestinationPath "$env:DIST/webai2api-win64.zip" -Force

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: webai2api
          path: ${{ env.DIST }}/*-win64.zip

      - name: Sign with SignPath
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CFG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: true

      - name: Use signed archive for release
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          Copy-Item "signed/*-win64.zip" "$env:DIST/webai2api-win64.zip" -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST }}/*-win64.zip
          generate_release_notes: true
