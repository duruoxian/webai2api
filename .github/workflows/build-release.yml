name: Build & Release (Windows exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Pick edition by tag
        shell: pwsh
        run: |
          # 同一代码库双版本：tag 以 -lite 结尾 → 客户版（lite spec），否则专业版
          if ("$env:GITHUB_REF_NAME" -like "*-lite") {
            "EDITION=lite"     | Out-File -FilePath $env:GITHUB_ENV -Append
            "SPEC=webai2api-lite.spec" | Out-File -FilePath $env:GITHUB_ENV -Append
            "DIST=dist-lite"   | Out-File -FilePath $env:GITHUB_ENV -Append
            "WORK=build-lite"  | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "EDITION=pro"      | Out-File -FilePath $env:GITHUB_ENV -Append
            "SPEC=webai2api.spec" | Out-File -FilePath $env:GITHUB_ENV -Append
            "DIST=dist"        | Out-File -FilePath $env:GITHUB_ENV -Append
            "WORK=build"       | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build exe
        shell: pwsh
        run: pyinstaller $env:SPEC --noconfirm --distpath $env:DIST --workpath $env:WORK

      - name: Write usage note
        shell: pwsh
        run: |
          if ($env:EDITION -eq "lite") {
            @"
            webai2api 客户版 使用说明

            1. 双击 webai2api.exe，会自动启动服务并弹出管理面板窗口
               （若没弹出，浏览器访问面板地址，默认密码 admin，端口以窗口标题为准）
            2. 「设置」→ 粘贴作者发给你的 WB2. 授权码 → 激活
            3. 「账号」页 →「添加账号」→ 选平台 → 只填名称 → 保存
            4. 点「浏览器登录」，在内置窗口里登录你自己的 AI 账号，凭证自动保存
            5. 「API Key」页 →「创建 Key」，复制 sk- 开头的 Key
            6. 面板里点「接入 opencode」一键写入配置，重启 opencode 即可

            支持平台：DeepSeek / 智谱清言 / Kimi / 通义千问（四家均支持工具调用与联网搜索）
            数据保存在 %LOCALAPPDATA%\webai2api-lite\data，卸载程序不会删除。
            "@ | Out-File -Encoding utf8 dist-lite/webai2api/使用说明.txt
          } else {
            @"
            webai2api 使用说明

            1. 双击 webai2api.exe，会自动启动服务并弹出管理面板窗口
               （若没弹出，浏览器访问 http://127.0.0.1:8800/admin，默认密码 admin）
            2. 「账号」页 →「添加账号」→ 只填名称 → 保存
            3. 点该账号的「浏览器登录」，在弹出的内置浏览器里登录你自己的 DeepSeek
               （手机号验证码/密码/微信/Apple 均可），登录后凭证自动保存
            4. 「API Key」页 →「生成 Key」，复制这个 sk- 开头的 Key
            5. 在 opencode 接入（设置 → 提供商 → 自定义提供商）：
                 提供商 ID : webai2api
                 显示名称  : DeepSeek 网页版 (webai2api)
                 基础 URL  : http://127.0.0.1:8800/v1
                 API 密钥  : 你生成的 sk-...
                 模型      : deepseek-chat  和  deepseek-reasoner
            6. 保存后在模型列表选 webai2api/deepseek-chat 即可使用

            说明：Base URL 永远是 http://127.0.0.1:8800/v1 —— 127.0.0.1 指"运行本软件的这台电脑"。
                  别人在他自己电脑上跑本软件，也填这个（各用各的，互不依赖，跟你无关）。
            内置浏览器是软件内的 WebView2 窗口，不调用你的 Edge/Chrome，也不会影响你日常浏览器的登录。
            数据（账号/Key/用量）保存在同目录 data 文件夹，删除即重置。
            端口默认 8800，被占用会自动更换（见 current_port.txt）。
            "@ | Out-File -Encoding utf8 dist/webai2api/使用说明.txt
          }

      - name: Package zip
        shell: pwsh
        run: |
          $app = "$env:DIST/webai2api"
          Remove-Item -Recurse -Force "$app/data" -ErrorAction SilentlyContinue
          Remove-Item -Force "$app/webai2api.log" -ErrorAction SilentlyContinue
          Remove-Item -Force "$app/current_port.txt" -ErrorAction SilentlyContinue
          if ($env:EDITION -eq "lite") {
            Compress-Archive -Path $app -DestinationPath dist-lite/webai2api-lite-win64.zip -Force
          } else {
            Compress-Archive -Path $app -DestinationPath dist/webai2api-win64.zip -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webai2api-${{ env.EDITION }}
          path: ${{ env.DIST }}/*-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST }}/*-win64.zip
          generate_release_notes: true
