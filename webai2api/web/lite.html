<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webai2api</title>
<link rel="stylesheet" href="/admin/static/lite.css?v=0.1.10">
</head>
<body>
<div class="wrap">

  <!-- ── 首次向导 ── -->
  <section id="wizard" class="pane">
    <div class="brand">
      <div class="logo">⌃</div>
      <h1>webai2api</h1>
      <p class="sub">把你的 AI 账号变成 OpenAI 兼容接口</p>
    </div>

    <div class="steps">
      <div class="step-dot active" data-step="1"></div>
      <div class="step-dot" data-step="2"></div>
      <div class="step-dot" data-step="3"></div>
    </div>

    <!-- 1. 选择平台 -->
    <div class="step" id="step1">
      <h2>选择要接入的平台</h2>
      <p class="hint">用你自己的账号，不经过任何第三方。</p>
      <div class="choices">
        <button class="choice" onclick="pickProvider('deepseek')">
          <b>DeepSeek</b><span>deepseek-chat · deepseek-reasoner</span>
        </button>
        <button class="choice" onclick="pickProvider('chatglm')">
          <b>智谱清言</b><span>GLM-5.3 · GLM-5.3-Flash</span>
        </button>
        <button class="choice" onclick="pickProvider('kimi')">
          <b>Kimi</b><span>kimi-k3 · kimi-k2.8 · kimi-k2.6</span>
        </button>
        <button class="choice" onclick="pickProvider('qwen')">
          <b>通义千问</b><span>qwen3.7-plus · qwen3.8-max · omni-flash</span>
        </button>
      </div>
    </div>

    <!-- 2. 登录 -->
    <div class="step" id="step2" hidden>
      <h2>登录 <span id="loginProviderName">DeepSeek</span></h2>
      <p class="hint">点击下面的按钮，会弹出登录窗口。登录成功后窗口会自动关闭。</p>
      <div class="login-box">
        <div class="login-state" id="loginState">尚未登录</div>
        <button class="btn primary" id="loginBtn" onclick="startLogin()">打开登录窗口</button>
      </div>
    </div>

    <!-- 3. 完成 -->
    <div class="step" id="step3" hidden>
      <h2>准备就绪</h2>
      <p class="hint">接下来把 opencode 连接到本机服务，只需点一下。</p>
      <div class="ready-box">
        <div class="ready-row"><span>服务地址</span><code id="wizardBase">—</code></div>
        <div class="ready-row"><span>已登录账号</span><b id="wizardAcc">—</b></div>
      </div>
      <button class="btn primary" onclick="applyConfig()">一键接入 opencode</button>
      <button class="btn ghost" onclick="finishWizard()">稍后再说，先进入主界面</button>
    </div>
  </section>

  <!-- ── 主界面 ── -->
  <section id="main" class="pane" hidden>
    <header class="top">
      <div class="top-left">
        <div class="dot ok" id="svcDot"></div>
        <span id="svcText">服务运行中</span>
      </div>
      <button class="icon-btn" onclick="showSettings()" title="设置">⚙</button>
    </header>

    <div class="hero">
      <div class="hero-label">今日用量</div>
      <div class="hero-num" id="todayTokens">0</div>
      <div class="hero-sub" id="todayReqs">0 次请求</div>
      <div class="spark" id="spark"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>账号</h3>
        <button class="btn tiny" onclick="showLogin()">+ 登录账号</button>
      </div>
      <div id="accList" class="acc-list"></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>接入客户端</h3></div>
      <div class="connect-row">
        <button class="btn primary wide" onclick="applyConfig()">一键接入 opencode</button>
      </div>
      <div class="connect-row">
        <button class="btn ghost wide" onclick="showSnippet()">手动配置 / 其他客户端</button>
      </div>
      <div class="conn-status" id="connStatus"></div>
    </div>

    <div class="lic-bar" id="licBar"></div>
  </section>

  <!-- ── 设置 ── -->
  <section id="settings" class="pane" hidden>
    <header class="top">
      <button class="icon-btn" onclick="showMain()" title="返回">←</button>
      <h2 class="top-title">设置</h2>
    </header>

    <div class="card">
      <label class="chk"><input type="checkbox" id="setAutostart" onchange="saveSettings()"> 开机自动启动</label>
      <label class="chk"><input type="checkbox" id="setTray" onchange="saveSettings()"> 关闭窗口时最小化到托盘</label>
    </div>

    <div class="card">
      <div class="card-head"><h3>授权</h3></div>
      <div id="licInfo" class="lic-info"></div>
      <div class="machine-row">
        <span>本机机器码</span>
        <code id="machineCode">—</code>
        <button class="btn tiny" onclick="copyText(document.getElementById('machineCode').textContent)">复制</button>
      </div>
      <button class="btn ghost sm" onclick="showLicenseInput()">输入授权码</button>
      <div id="licInputBox" hidden>
        <textarea id="licInput" placeholder="把作者发给你的授权内容粘贴到这里"></textarea>
        <button class="btn primary sm" onclick="installLicense()">验证并保存</button>
      </div>
    </div>

    <div class="card about-mini">
      <div>版本 <b id="verText">—</b></div>
      <div class="hint">仅用于个人学习研究。使用本工具可能违反平台服务条款，请自行评估风险。</div>
    </div>
  </section>

</div>

<!-- 配置片段弹窗 -->
<div id="snippetModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>手动配置</h3>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <p class="hint">复制下面内容，粘贴到 opencode 配置文件的 <code>provider</code> 里。</p>
    <pre id="snippetText"></pre>
    <div class="modal-foot">
      <button class="btn ghost" onclick="copyText(document.getElementById('snippetText').textContent)">复制</button>
      <button class="btn primary" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
let TOKEN='';
let STATE=null;
let PROVIDER='deepseek';
const PROV_LABEL={deepseek:'DeepSeek',chatglm:'智谱清言',kimi:'Kimi',qwen:'通义千问'};
function provLabel(p){ return PROV_LABEL[p]||p||'DeepSeek'; }
let LOGIN_ACC='';
let LOGIN_TIMER=null;

const $=id=>document.getElementById(id);

async function api(path, method='GET', body){
  const opt={method, headers:{'Content-Type':'application/json'}};
  if(TOKEN) opt.headers['x-admin-token']=TOKEN;
  if(body!==undefined) opt.body=JSON.stringify(body);
  try{
    const r=await fetch('/admin/api'+path, opt);
    const j=await r.json().catch(()=>({}));
    if(r.status===401){ showLoginGate(); return null; }
    return j;
  }catch(e){ return null; }
}

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(t._t); t._t=setTimeout(()=>{t.hidden=true;}, 2600);
}
function copyText(s){
  navigator.clipboard.writeText(s).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
}
function show(id){
  ['wizard','main','settings'].forEach(x=>{ $(x).hidden = (x!==id); });
}
function showMain(){ show('main'); loadState(); }
function showSettings(){ show('settings'); loadSettings(); }

// ── 登录门 ──
function showLoginGate(){
  const pw=prompt('请输入管理密码（首次为 admin）');
  if(pw===null) return;
  fetch('/admin/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pw})}).then(r=>r.json()).then(j=>{
    if(j&&j.ok){ TOKEN=j.token; sessionStorage.setItem('tk',TOKEN); boot(); }
    else toast((j&&j.error)||'密码错误');
  }).catch(()=>toast('登录失败'));
}

// ── 启动 ──
async function boot(){
  TOKEN=TOKEN||sessionStorage.getItem('tk')||'';
  if(!TOKEN){ showLoginGate(); return; }
  const j=await api('/lite/state');
  if(!j){ return; }
  STATE=j;
  const logged=j.accounts.some(a=>a.logged_in);
  if(!logged){
    show('wizard');
    setStep(1);
  }else{
    show('main');
    renderMain();
  }
  renderLicBar();
}

// ── 向导 ──
function setStep(n){
  [1,2,3].forEach(i=>{ $('step'+i).hidden = (i!==n); });
  document.querySelectorAll('.step-dot').forEach(d=>{
    d.classList.toggle('active', Number(d.dataset.step)<=n);
  });
}
function pickProvider(p){
  PROVIDER=p;
  $('loginProviderName').textContent = provLabel(p);
  setStep(2);
}
async function startLogin(){
  $('loginBtn').disabled=true;
  $('loginState').textContent='正在打开登录窗口…';
  const j=await api('/lite/login','POST',{provider:PROVIDER});
  if(!j||!j.ok){
    $('loginState').textContent=(j&&j.error)||'启动失败';
    $('loginBtn').disabled=false;
    return;
  }
  LOGIN_ACC=j.account_id;
  pollLogin();
}
function pollLogin(){
  clearTimeout(LOGIN_TIMER);
  LOGIN_TIMER=setTimeout(async()=>{
    const j=await api('/lite/login/'+LOGIN_ACC);
    const st=(j&&j.state)||{};
    if(st.status==='success'){
      $('loginState').textContent='登录成功 ✓';
      $('loginBtn').disabled=false;
      const s=await api('/lite/state');
      if(s){ STATE=s; $('wizardAcc').textContent=(s.accounts.find(a=>a.logged_in)||{}).name||'—'; }
      $('wizardBase').textContent=location.origin+'/v1';
      setStep(3);
      return;
    }
    if(st.status==='error'){
      $('loginState').textContent=st.message||'登录失败';
      $('loginBtn').disabled=false;
      return;
    }
    $('loginState').textContent=st.message||'等待登录…';
    pollLogin();
  }, 1500);
}
function finishWizard(){ show('main'); loadState(); }

// ── 主界面 ──
async function loadState(){
  const j=await api('/lite/state');
  if(!j) return;
  STATE=j;
  renderMain();
  renderLicBar();
}
function fmtTok(n){
  n=Number(n)||0;
  if(n>=1e8) return (n/1e8).toFixed(2)+'亿';
  if(n>=1e4) return (n/1e4).toFixed(1)+'万';
  return n.toLocaleString();
}
function renderMain(){
  const s=STATE; if(!s) return;
  const t=s.today||{};
  $('todayTokens').textContent=fmtTok(t.t);
  $('todayReqs').textContent=(t.n||0)+' 次请求';
  $('svcDot').className='dot '+(s.ready?'ok':'warn');
  $('svcText').textContent=s.ready?'服务运行中':'等待登录账号';
  renderSpark(s.daily||[]);
  renderAccounts(s.accounts||[]);
  checkConnect();
  $('verText').textContent='v'+s.version;
}
function renderSpark(days){
  const el=$('spark');
  if(!days.length){ el.innerHTML='<div class="spark-empty">还没有用量记录</div>'; return; }
  const max=Math.max(1,...days.map(d=>Number(d.t)||0));
  el.innerHTML=days.map(d=>{
    const h=Math.max(3, Math.round((Number(d.t)||0)/max*40));
    return `<div class="spark-bar" title="${d.d} · ${fmtTok(d.t)}"><i style="height:${h}px"></i></div>`;
  }).join('');
}
function renderAccounts(list){
  const el=$('accList');
  if(!list.length){ el.innerHTML='<div class="empty">还没有账号</div>'; return; }
  el.innerHTML=list.map(a=>`
    <div class="acc-row">
      <div class="acc-main">
        <b>${esc(a.name)}</b>
        <span class="muted">${esc(a.provider_label)}</span>
      </div>
      <div class="acc-status ${a.logged_in?'ok':'warn'}">${a.logged_in?'已登录':'未登录'}</div>
      <button class="btn tiny ghost" onclick="relogin('${a.id}','${esc(a.provider)}')">重新登录</button>
    </div>`).join('');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showLogin(){
  show('wizard'); setStep(1);
}
async function relogin(id, provider){
  PROVIDER=provider;
  $('loginProviderName').textContent = provLabel(provider);
  show('wizard'); setStep(2);
  const j=await api('/lite/login','POST',{provider});
  if(j&&j.ok){ LOGIN_ACC=j.account_id; $('loginState').textContent='正在打开登录窗口…'; pollLogin(); }
  else toast((j&&j.error)||'启动失败');
}
async function checkConnect(){
  const j=await api('/lite/connect/check');
  if(!j) return;
  const el=$('connStatus');
  if(j.configured) el.innerHTML='<span class="ok">✓ 已接入 opencode</span>';
  else if(!j.config_exists) el.innerHTML='<span class="warn">未检测到 opencode 配置，点击上方按钮自动创建</span>';
  else el.innerHTML='<span class="warn">尚未接入，点击上方按钮</span>';
}

// ── 接入 ──
async function applyConfig(){
  const j=await api('/lite/connect/apply','POST',{});
  if(!j){ return; }
  if(j.applied){
    toast('已写入配置，请重启 opencode');
    checkConnect();
  }else{
    $('snippetText').textContent=j.snippet||'';
    $('snippetModal').hidden=false;
    if(j.error) toast(j.error);
  }
}
async function showSnippet(){
  const j=await api('/lite/connect');
  if(!j) return;
  $('snippetText').textContent=j.snippet||'';
  $('snippetModal').hidden=false;
}
function closeModal(){ $('snippetModal').hidden=true; }

// ── 设置 ──
async function loadSettings(){
  const s=await api('/lite/state');
  if(s) STATE=s;
  const sys=await fetch('/admin/api/system',{headers:{'x-admin-token':TOKEN}}).then(r=>r.json()).catch(()=>null);
  if(sys&&sys.ok){ $('setAutostart').checked=!!sys.autostart; }
  const lic=(STATE&&STATE.license)||{};
  $('machineCode').textContent=lic.machine||'—';
  $('licInfo').innerHTML = lic.valid
    ? `<div class="ok">✓ 授权有效 · 剩余 ${lic.days_left} 天</div><div class="muted">到期日 ${esc(lic.expires)}</div>`
    : `<div class="warn">未授权 / 已失效</div><div class="muted">${esc(lic.reason||'')}</div>`;
  $('verText').textContent='v'+(STATE?STATE.version:'');
}
async function saveSettings(){
  await api('/lite/settings','POST',{
    autostart:$('setAutostart').checked,
    tray:$('setTray').checked
  });
  toast('已保存');
}
function showLicenseInput(){ $('licInputBox').hidden=false; }
async function installLicense(){
  const content=$('licInput').value.trim();
  if(!content){ toast('请粘贴授权内容'); return; }
  const j=await api('/lite/license/install','POST',{content});
  if(j&&j.ok){ toast('授权已生效'); $('licInputBox').hidden=true; loadSettings(); }
  else toast((j&&j.error)||'授权无效');
}
function renderLicBar(){
  const lic=(STATE&&STATE.license)||{};
  const el=$('licBar');
  if(!el) return;
  if(lic.valid && lic.days_left>7){ el.innerHTML=''; return; }
  if(lic.valid){
    el.innerHTML=`<div class="lic-warn">授权还剩 ${lic.days_left} 天，请及时续期</div>`;
  }else{
    el.innerHTML=`<div class="lic-warn bad">${esc(lic.reason||'未授权')} · 请到设置里输入授权码</div>`;
  }
}

// ── 轮询 ──
setInterval(()=>{ if(!$('main').hidden) loadState(); }, 15000);
boot();
</script>
</body>
</html>
